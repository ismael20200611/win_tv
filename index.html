<!DOCTYPE html>
<html lang="ku">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Kurdish City Control</title>


<style>

/* =========================================
   BASIC
========================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: white;
    font-family: Arial, "Noto Sans Arabic", sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    overflow-y: auto;
}

/* =========================================
   MAIN APP
========================================= */

.app {
    width: 100%;
    max-width: 1100px;
    padding: 18px;
    display: flex;
    flex-direction: column;
}

/* =========================================
   TOP HEADER
========================================= */

.header {
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #252525;
    margin-bottom: 12px;
}

.title {
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 2px;
}

.subtitle {
    color: #666;
    font-size: 11px;
}

.output-btn {
    background: #111;
    color: white;
    border: 1px solid #555;
    padding: 6px 16px;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.2s;
}

.output-btn:hover {
    border-color: #00d9ff;
    color: #00d9ff;
    box-shadow: 0 0 10px rgba(0, 217, 255, 0.3);
}

/* =========================================
   SPECIAL LANGUAGE CONTROL
========================================= */

.language-panel {
    width: 100%;
    min-height: 70px;
    background: linear-gradient(145deg, #151515, #080808);
    border: 2px solid #555;
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
}

.language-label {
    font-size: 14px;
    font-weight: bold;
    color: #aaa;
    white-space: nowrap;
}

#languageSelect {
    width: 280px;
    height: 43px;
    background: #111;
    color: white;
    border: 2px solid #777;
    border-radius: 6px;
    padding: 0 12px;
    font-size: 14px;
    outline: none;
    cursor: pointer;
}

#languageSelect:focus {
    border-color: #00d9ff;
    box-shadow: 0 0 10px rgba(0, 217, 255, 0.3);
}

#languageSelect option {
    background: #111;
    color: white;
}

/* =========================================
   GRID
========================================= */

.grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 30px;
}

/* =========================================
   CITY BOX
========================================= */

.city-card {
    background: linear-gradient(145deg, #121212, #070707);
    border: 3px solid var(--box-color);
    border-radius: 8px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    min-width: 0;
    transition: 0.2s;
}

.city-card:hover {
    box-shadow: 0 0 14px var(--box-color);
    transform: translateY(-2px);
}

.card-header {
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
}

.number {
    width: 27px;
    height: 27px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--box-color);
    color: #000;
    border-radius: 5px;
    font-weight: bold;
    font-size: 13px;
}

.live {
    color: #666;
    font-size: 10px;
    letter-spacing: 1px;
}

.controls {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.city-select,
.city-input {
    width: 100%;
    height: 40px;
    background: #151515;
    color: white;
    border: 1px solid #333;
    border-radius: 5px;
    outline: none;
    padding: 0 9px;
    font-size: 13px;
}

.city-select {
    cursor: pointer;
}

.city-select option {
    background: #111;
    color: white;
}

.city-input::placeholder {
    color: #666;
}

.city-select:focus,
.city-input:focus {
    border-color: var(--box-color);
    box-shadow: 0 0 7px var(--box-color);
}

.status {
    height: 25px;
    display: flex;
    align-items: center;
    font-size: 11px;
    color: #555;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.status.ok { color: #55ff55; }
.status.error { color: #ff4444; }

/* COLORS */
.box-1 { --box-color: #8cff00; }
.box-2 { --box-color: #ffe000; }
.box-3 { --box-color: #ff1717; }
.box-4 { --box-color: #6500ff; }
.box-5 { --box-color: #00afd0; }
.box-6 { --box-color: #b900ff; }
.box-7 { --box-color: #79513f; }

/* =========================================
   INLINE OUTPUT SECTION (BELOW GRID)
========================================= */

.output-wrapper {
    display: none;
    width: 100%;
    background: #fff;
    color: #000;
    border-radius: 8px;
    padding: 40px 20px 65px 20px;
    margin-top: 10px;
    margin-bottom: 40px;
}

.output-container {
    position: relative;
    width: 100%;
    max-width: 900px;
    height: 450px;
    border: 4px solid black;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    padding: 30px 0;
}

.out-line {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 4px;
    background: black;
}
.line-1 { left: 23%; }
.line-2 { left: 46%; }
.line-3 { left: 71%; }

.out-bar {
    position: relative;
    background: #1427ea;
    height: 50px;
    display: flex;
    align-items: center;
    color: white;
    font-weight: bold;
    font-size: 18px;
    z-index: 2;
}
.out-bar-top { width: 71%; }
.out-bar-bottom { width: 100%; }

.out-item {
    position: absolute;
    top: 0;
    bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    padding: 0 4px;
}

.pos-1 { left: 0%; width: 32.4%; }
.pos-2 { left: 32.4%; width: 32.4%; }
.pos-3 { left: 64.8%; width: 35.2%; }

.pos-4 { left: 0%; width: 23%; }
.pos-5 { left: 23%; width: 23%; }
.pos-6 { left: 46%; width: 25%; }
.pos-7 { left: 71%; width: 29%; }

.out-footer-controls {
    position: absolute;
    bottom: -55px;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
}

.out-label {
    font-weight: bold;
    font-size: 20px;
    color: #000;
}

/* MODERN TOP BUTTON DESIGN */
.scroll-top-btn {
    background: linear-gradient(135deg, #111111 0%, #2a2a2a 100%);
    color: #ffffff;
    border: 1px solid #444444;
    padding: 8px 20px;
    border-radius: 30px;
    cursor: pointer;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 1.5px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    outline: none;
}

.scroll-top-btn span {
    display: inline-block;
    transition: transform 0.3s ease;
}

.scroll-top-btn:hover {
    background: linear-gradient(135deg, #00d9ff 0%, #0072ff 100%);
    color: #ffffff;
    border-color: transparent;
    box-shadow: 0 6px 20px rgba(0, 217, 255, 0.4);
    transform: translateY(-3px);
}

.scroll-top-btn:hover span {
    transform: translateY(-2px);
}

.scroll-top-btn:active {
    transform: translateY(-1px);
    box-shadow: 0 3px 10px rgba(0, 217, 255, 0.3);
}

/* FOOTER & FULLSCREEN */
.footer {
    height: 25px;
    margin-top: 8px;
    display: flex;
    align-items: center;
    color: #555;
    font-size: 10px;
}

.fullscreen-btn {
    position: fixed;
    right: 15px;
    bottom: 15px;
    width: 42px;
    height: 42px;
    border: 1px solid #333;
    border-radius: 7px;
    background: #111;
    color: #aaa;
    font-size: 20px;
    cursor: pointer;
    z-index: 100;
}

</style>

</head>

<body>

<div class="app">

    <div class="header" id="topHeader">
        <div class="title">CITY CONTROL</div>
        <div class="subtitle">7 LIVE BOXES</div>
        <button class="output-btn" id="outputBtn">OUTPUT</button>
    </div>

    <div class="language-panel">
        <div class="language-label">LANGUAGE</div>
        <select id="languageSelect">
            <option value="sorani" selected>کوردیی سۆرانی</option>
            <option value="kurmanji">Kurdî Kurmancî</option>
        </select>
    </div>

    <div class="grid">
        <div class="city-card box-1">
            <div class="card-header">
                <div class="number">1</div>
                <div class="live">LIVE 1</div>
            </div>
            <div class="controls">
                <select class="city-select"><option value="">Select City</option></select>
                <input type="text" class="city-input" placeholder="Write city..." autocomplete="off">
                <div class="status"></div>
            </div>
        </div>

        <div class="city-card box-2">
            <div class="card-header">
                <div class="number">2</div>
                <div class="live">LIVE 2</div>
            </div>
            <div class="controls">
                <select class="city-select"><option value="">Select City</option></select>
                <input type="text" class="city-input" placeholder="Write city..." autocomplete="off">
                <div class="status"></div>
            </div>
        </div>

        <div class="city-card box-3">
            <div class="card-header">
                <div class="number">3</div>
                <div class="live">LIVE 3</div>
            </div>
            <div class="controls">
                <select class="city-select"><option value="">Select City</option></select>
                <input type="text" class="city-input" placeholder="Write city..." autocomplete="off">
                <div class="status"></div>
            </div>
        </div>

        <div class="city-card box-4">
            <div class="card-header">
                <div class="number">4</div>
                <div class="live">LIVE 4</div>
            </div>
            <div class="controls">
                <select class="city-select"><option value="">Select City</option></select>
                <input type="text" class="city-input" placeholder="Write city..." autocomplete="off">
                <div class="status"></div>
            </div>
        </div>

        <div class="city-card box-5">
            <div class="card-header">
                <div class="number">5</div>
                <div class="live">LIVE 5</div>
            </div>
            <div class="controls">
                <select class="city-select"><option value="">Select City</option></select>
                <input type="text" class="city-input" placeholder="Write city..." autocomplete="off">
                <div class="status"></div>
            </div>
        </div>

        <div class="city-card box-6">
            <div class="card-header">
                <div class="number">6</div>
                <div class="live">LIVE 6</div>
            </div>
            <div class="controls">
                <select class="city-select"><option value="">Select City</option></select>
                <input type="text" class="city-input" placeholder="Write city..." autocomplete="off">
                <div class="status"></div>
            </div>
        </div>

        <div class="city-card box-7">
            <div class="card-header">
                <div class="number">7</div>
                <div class="live">LIVE 7</div>
            </div>
            <div class="controls">
                <select class="city-select"><option value="">Select City</option></select>
                <input type="text" class="city-input" placeholder="Write city..." autocomplete="off">
                <div class="status"></div>
            </div>
        </div>
    </div>

    <div class="output-wrapper" id="outputWrapper">
        <div class="output-container">
            <div class="out-line line-1"></div>
            <div class="out-line line-2"></div>
            <div class="out-line line-3"></div>

            <div class="out-bar out-bar-top">
                <div class="out-item pos-1" id="out1">1</div>
                <div class="out-item pos-2" id="out2">2</div>
                <div class="out-item pos-3" id="out3">3</div>
            </div>

            <div class="out-bar out-bar-bottom">
                <div class="out-item pos-4" id="out4">4</div>
                <div class="out-item pos-5" id="out5">5</div>
                <div class="out-item pos-6" id="out6">6</div>
                <div class="out-item pos-7" id="out7">7</div>
            </div>

            <div class="out-footer-controls">
                <div class="out-label">output</div>
                <button class="scroll-top-btn" id="scrollTopBtn"><span>▲</span> TOP</button>
            </div>
        </div>
    </div>

    <div class="footer">Kurdî Kurmancî • کوردیی سۆرانی</div>

</div>

<button class="fullscreen-btn" id="fullscreenBtn">⛶</button>

<script>

const cityData = {
    sorani: [
        { value: "ranya", name: "ڕانیە" },
        { value: "rûdaw", name: "رووداو" },
        { value: "erbil", name: "هەولێر" },
        { value: "sulaymany", name: "سلێمانی" },
        { value: "halabja", name: "هەڵەبجە" },
        { value: "duhok", name: "دهۆک" }
    ],
    kurmanji: [
        { value: "ranya", name: "RANYA" },
        { value: "rûdaw", name: "RÛDAW" },
        { value: "erbil", name: "HEWLÊR" },
        { value: "sulaymany", name: "SILÊMANÎ" },
        { value: "halabja", name: "HELEBÇE" },
        { value: "duhok", name: "DUHOK" }
    ]
};

const languageSelect = document.getElementById("languageSelect");
const cards = document.querySelectorAll(".city-card");

function loadCities(language) {
    cards.forEach(card => {
        const citySelect = card.querySelector(".city-select");
        const cityInput = card.querySelector(".city-input");
        const status = card.querySelector(".status");

        cityInput.value = "";
        status.textContent = "";
        status.className = "status";
        citySelect.innerHTML = "";

        const defaultOption = document.createElement("option");
        defaultOption.value = "";
        defaultOption.textContent = "Select City";
        citySelect.appendChild(defaultOption);

        if (!language) return;

        cityData[language].forEach(city => {
            const option = document.createElement("option");
            option.value = city.value;
            option.textContent = city.name;
            citySelect.appendChild(option);
        });
    });
}

languageSelect.addEventListener("change", function() {
    loadCities(this.value);
});

cards.forEach(card => {
    const citySelect = card.querySelector(".city-select");
    const cityInput = card.querySelector(".city-input");
    const status = card.querySelector(".status");

    citySelect.addEventListener("change", function() {
        const language = languageSelect.value;
        const value = this.value;

        if (!language || !value) {
            cityInput.value = "";
            status.textContent = "";
            status.className = "status";
            return;
        }

        const city = cityData[language].find(item => item.value === value);
        if (city) {
            cityInput.value = city.name;
            status.textContent = "✓ Data available";
            status.className = "status ok";
        }
    });

    cityInput.addEventListener("input", function() {
        const language = languageSelect.value;
        const typed = this.value.trim();

        if (!language) {
            status.textContent = "Select language first";
            status.className = "status error";
            return;
        }

        if (typed === "") {
            citySelect.value = "";
            status.textContent = "";
            status.className = "status";
            return;
        }

        const city = cityData[language].find(item => item.name.toLowerCase() === typed.toLowerCase());
        if (city) {
            citySelect.value = city.value;
            cityInput.value = city.name;
            status.textContent = "✓ Data available";
            status.className = "status ok";
        } else {
            citySelect.value = "";
            status.textContent = "✕ No data available";
            status.className = "status error";
        }
    });
});

loadCities("sorani");

/* OUTPUT RENDER */
document.getElementById("outputBtn").addEventListener("click", () => {
    const cityInputs = document.querySelectorAll(".city-input");
    const cities = Array.from(cityInputs).map(input => input.value.trim());

    document.getElementById("out1").textContent = cities[0] || "1";
    document.getElementById("out2").textContent = cities[1] || "2";
    document.getElementById("out3").textContent = cities[2] || "3";
    document.getElementById("out4").textContent = cities[3] || "4";
    document.getElementById("out5").textContent = cities[4] || "5";
    document.getElementById("out6").textContent = cities[5] || "6";
    document.getElementById("out7").textContent = cities[6] || "7";

    const wrapper = document.getElementById("outputWrapper");
    wrapper.style.display = "block";
    wrapper.scrollIntoView({ behavior: "smooth" });
});

/* SCROLL TO TOP */
document.getElementById("scrollTopBtn").addEventListener("click", () => {
    document.getElementById("topHeader").scrollIntoView({ behavior: "smooth" });
});

/* FULLSCREEN */
const fullscreenBtn = document.getElementById("fullscreenBtn");

fullscreenBtn.addEventListener("click", async () => {
    try {
        if (!document.fullscreenElement) {
            await document.documentElement.requestFullscreen();
            fullscreenBtn.textContent = "✕";
        } else {
            await document.exitFullscreen();
            fullscreenBtn.textContent = "⛶";
        }
    } catch (error) {
        console.log(error);
    }
});

document.addEventListener("fullscreenchange", () => {
    fullscreenBtn.textContent = document.fullscreenElement ? "✕" : "⛶";
});

</script>

</body>
</html>
